name: organization-baseline-policy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate staged relationship compatibility graph
        run: >-
          python3
          .github-hardening/proposed/relationship-graph-v1/scripts/validate_repository_relationships.py
          .github-hardening/proposed/relationship-graph-v1
